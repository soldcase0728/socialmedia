[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wilson-rode-indexer"
version = "1.0.0"
description = "Local, read-only derived document index and triage tool for a Bates-numbered legal document production"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - internal use" }
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Text Processing :: Indexing",
    "Private :: Do Not Upload",
]
dependencies = [
    "PyMuPDF>=1.24,<2",
    "pypdf>=4.2,<8",
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
    "python-dateutil>=2.9,<3",
    "rapidfuzz>=3.9,<4",
    "tqdm>=4.66,<5",
    "Pillow>=10.3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]

[project.scripts]
wri = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
